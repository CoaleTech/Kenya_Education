[project]
name = "frappe_education_kenya"
version = "1.0.0"
description = "Kenya CBC-aligned education management extension for Frappe Education"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Frappe Education Kenya Team", email = "dev@frappeeducationkenya.com" }
]
keywords = ["frappe", "education", "kenya", "cbc", "school-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Framework :: Frappe",
]
requires-python = ">=3.10"
dependencies = [
    "frappe>=15.0.0",
    "erpnext>=15.0.0",
]

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "frappe_education_kenya"
